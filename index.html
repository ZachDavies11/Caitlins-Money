<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caitlin's Money</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caitlin's Money">
<meta name="application-name" content="Caitlin's Money">
<meta name="theme-color" content="#ffc2dc">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a phone home screen — soft pink wallpaper, an app-icon header, and one big frosted-glass widget holding the calculator. Deliberately single-theme (pink in light and dark). */
:root {
  --wall-a: #ffd6e8;
  --wall-b: #ffb3d1;
  --wall-c: #f9c8ff;
  --glass: rgba(255, 255, 255, 0.55);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --ink: #6b1f45;
  --soft: #a8577f;
  --hot: #ff4f9a;
  --hot-deep: #e0337f;
  --white: #ffffff;
  --round: "Fredoka", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--body);
  background:
    radial-gradient(circle at 15% 10%, var(--wall-c) 0, transparent 45%),
    radial-gradient(circle at 90% 85%, var(--wall-c) 0, transparent 40%),
    linear-gradient(160deg, var(--wall-a), var(--wall-b));
  background-color: var(--wall-a);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  overflow-x: hidden;
}
.sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.sparkles span { position: absolute; color: var(--white); opacity: .8; font-size: 18px; }
main { position: relative; z-index: 1; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.status { display: flex; justify-content: space-between; font-family: var(--round); font-weight: 600; font-size: 15px; color: var(--ink); padding: 0 6px; }

.app { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon {
  width: 68px; height: 68px; border-radius: 18px;
  background: linear-gradient(145deg, #ff8fc0, var(--hot));
  box-shadow: 0 10px 24px rgba(224, 51, 127, .35), inset 0 2px 0 rgba(255,255,255,.5);
  display: grid; place-items: center;
}
.icon { overflow: hidden; }
.icon svg { width: 100%; height: 100%; display: block; }
@media (prefers-reduced-motion: no-preference) {
  .fly { animation: flyaway 2.8s ease-in-out infinite; }
  .fly.b2 { animation-delay: -1.4s; }
  @keyframes flyaway {
    0% { transform: translate(-6px, 6px); opacity: 0; }
    20% { opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(5px, -6px); opacity: 0; }
  }
}
.app-name { font-family: var(--round); font-weight: 600; font-size: 15px; color: var(--ink); }

.widget {
  background: var(--glass);
  border: 1.5px solid var(--glass-edge);
  border-radius: 34px;
  padding: 20px 20px 18px;
  box-shadow: 0 18px 40px rgba(193, 54, 120, .18);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  display: flex; flex-direction: column; gap: 14px;
}
h1 { font-family: var(--round); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0; text-align: center; text-wrap: balance; }
h1 em { font-style: normal; color: var(--hot-deep); }

.tabs { display: flex; align-self: center; gap: 4px; padding: 4px; background: rgba(255,255,255,.6); border-radius: 99px; }
.tabs button {
  font-family: var(--round); font-weight: 600; font-size: 14px; color: var(--soft);
  background: transparent; border: 0; border-radius: 99px; padding: 7px 16px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--hot); color: var(--white); box-shadow: 0 4px 10px rgba(224, 51, 127, .3); }
.tabs button:focus-visible { outline: 2px solid var(--hot-deep); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-family: var(--round); font-weight: 500; font-size: 14px; color: var(--soft); padding-left: 8px; }
.money {
  display: flex; align-items: center; background: var(--white);
  border-radius: 22px; border: 2px solid transparent;
  box-shadow: 0 4px 14px rgba(193, 54, 120, .12);
}
.money:focus-within { border-color: var(--hot); }
.money span { font-family: var(--round); font-weight: 600; font-size: 30px; padding-left: 20px; color: var(--hot); }
.money input {
  font-family: var(--round); font-weight: 600; font-size: 32px; color: var(--ink);
  background: transparent; border: 0; outline: none;
  padding: 14px 18px 14px 6px; width: 100%; min-width: 0;
}
.money input::placeholder { color: #f0b3cf; }

.result {
  background: linear-gradient(145deg, #ff86bc, var(--hot));
  color: var(--white); border-radius: 26px; padding: 20px 20px 18px;
  text-align: center; display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 12px 26px rgba(224, 51, 127, .3), inset 0 2px 0 rgba(255,255,255,.4);
}
.result .label { font-family: var(--round); font-weight: 500; font-size: 14px; opacity: .92; }
.big { font-family: var(--round); font-weight: 700; font-size: clamp(56px, 18vw, 76px); line-height: 1; font-variant-numeric: tabular-nums; }
.unit { font-family: var(--round); font-weight: 600; font-size: 20px; }

.rate { text-align: center; margin: 0; font-weight: 700; font-size: 14px; color: var(--soft); }
.rate b { color: var(--hot-deep); }

.dock {
  display: flex; justify-content: center; gap: 18px;
  background: rgba(255,255,255,.4); border: 1.5px solid var(--glass-edge);
  border-radius: 30px; padding: 12px; align-self: center;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.dock span { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; color: var(--white); }
.d1 { background: linear-gradient(145deg, #ffb6d5, #ff7fb4); }
.d2 { background: linear-gradient(145deg, #f2b8ff, #d77dff); }
.d3 { background: linear-gradient(145deg, #ffc9b8, #ff8f8f); }
.d4 { background: linear-gradient(145deg, #ffd9f0, #ff9fd0); }

@media (prefers-reduced-motion: no-preference) {
  .big.pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.85); } to { transform: none; } }
  .sparkles span { animation: flutter var(--dur, 5s) ease-in-out infinite; }
  @keyframes flutter {
    0%,100% { transform: translate(0, 0) rotate(-12deg) scale(.9); opacity: .55; }
    25% { transform: translate(6px, -10px) rotate(8deg) scale(1.05); opacity: .95; }
    50% { transform: translate(-4px, -18px) rotate(-6deg) scale(1); opacity: .8; }
    75% { transform: translate(5px, -8px) rotate(10deg) scale(1.1); opacity: .95; }
  }
  .icon { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
}
</style>

<div class="sparkles" id="sparkles" aria-hidden="true"></div>

<main>
  <div class="status" aria-hidden="true" hidden><span id="clock">9:41</span><span>♥ 100%</span></div>

  <div class="app">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none">
        <defs>
          <linearGradient id="ic-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa6cc"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
          <linearGradient id="ic-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe6f1"/></linearGradient>
          <g id="ic-wing">
            <ellipse cx="14" cy="-8" rx="18" ry="6.5" fill="#ffd6e8" transform="rotate(-10 14 -8)"/>
            <ellipse cx="13" cy="-15" rx="19" ry="6.5" fill="#ffeaf3" transform="rotate(-28 13 -15)"/>
            <ellipse cx="10" cy="-21" rx="18" ry="6.5" fill="#ffffff" transform="rotate(-48 10 -21)"/>
          </g>
        </defs>
        <rect width="120" height="120" fill="url(#ic-bg)"/>
        <g transform="translate(59 66) rotate(9)">
          <path d="M-10 26 L-14 36 M0 26 L0 38 M10 26 L14 36" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
          <g transform="translate(-22 -4) scale(-1 1)"><use href="#ic-wing"/></g>
          <g transform="translate(22 -4)"><use href="#ic-wing"/></g>
          <rect x="-30" y="-17" width="60" height="37" rx="5" fill="#e0337f" opacity=".25" transform="translate(1.5 2.5)"/>
          <rect x="-30" y="-17" width="60" height="37" rx="5" fill="url(#ic-paper)"/>
          <rect x="-25.5" y="-12.5" width="51" height="28" rx="3" fill="none" stroke="#ffc2dc" stroke-width="1.6"/>
          <circle cx="0" cy="1.5" r="10" fill="#ffe0ee"/>
          <text x="0" y="8.5" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="700" font-size="20" fill="#ff4f9a">$</text>
          <circle cx="-19" cy="-6" r="2" fill="#ffc2dc"/>
          <circle cx="19" cy="9" r="2" fill="#ffc2dc"/>
        </g>
      </svg>
    </div>
    <span class="app-name">Caitlin's Money</span>
  </div>

  <section class="widget" aria-label="Calculator">
    <h1>How many hours is it <em>worth?</em></h1>
    <div class="tabs" role="tablist" aria-label="Pay rate">
      <button type="button" role="tab" id="tab-weekday" data-rate="36.10">Weekdays</button>
      <button type="button" role="tab" id="tab-weekend" data-rate="40.10">Weekends</button>
    </div>
    <div class="field">
      <label for="price">Price</label>
      <div class="money"><span>$</span><input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" autofocus></div>
    </div>
    <div class="result" aria-live="polite">
      <span class="label">You'd need to work</span>
      <div class="big" id="big">0</div>
      <span class="unit" id="unit">hours</span>
    </div>
  </section>

</main>

<script>
(function () {
  let RATE = 36.10;
  const tabs = [document.getElementById("tab-weekday"), document.getElementById("tab-weekend")];
  function pick(tab) {
    tabs.forEach(t => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
    RATE = parseFloat(tab.dataset.rate);
    update();
  }
  tabs.forEach(t => t.addEventListener("click", () => pick(t)));
  const price = document.getElementById("price");
  const big = document.getElementById("big");
  const unit = document.getElementById("unit");
  function update() {
    const p = parseFloat(price.value);
    const h = isFinite(p) && p > 0 ? p / RATE : 0;
    let main, u;
    if (h > 0 && h < 1) { main = Math.max(1, Math.round(h * 60)); u = main === 1 ? "minute" : "minutes"; }
    else { const r = Math.round(h * 10) / 10; main = r % 1 ? r.toFixed(1) : r; u = r === 1 ? "hour" : "hours"; }
    big.textContent = main; unit.textContent = u;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
  }
  price.addEventListener("input", () => {
    let v = price.value.replace(/[^0-9.]/g, "");
    const i = v.indexOf(".");
    if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2);
    if (v !== price.value) price.value = v;
    update();
  });

  const sp = document.getElementById("sparkles");
  const shapes = ["♥", "♥", "♥", "♡", "✦"];
  const tints = ["#ffffff", "#ffffff", "#ff8fc0", "#ff4f9a", "#f2b8ff"];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("span");
    s.textContent = shapes[i % shapes.length];
    s.style.left = (Math.random() * 96) + "%";
    s.style.top = (Math.random() * 96) + "%";
    s.style.fontSize = (12 + Math.random() * 18) + "px";
    s.style.color = tints[Math.floor(Math.random() * tints.length)];
    s.style.setProperty("--dur", (4 + Math.random() * 4) + "s");
    s.style.animationDelay = (-Math.random() * 8) + "s";
    sp.append(s);
  }

  const clock = document.getElementById("clock");
  function tick() { const d = new Date(); clock.textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/i, ""); }
  tick(); setInterval(tick, 30000);
  const day = new Date().getDay();
  pick(day === 0 || day === 6 ? tabs[1] : tabs[0]);
})();
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
